<div class="request-form">
  <form (submit)="$event.preventDefault(); submit()">
    <div class="row">
      <label for="brokerageName">Brokerage name*</label>
      <input id="brokerageName" type="text" [value]="brokerageName()" (input)="brokerageName.set($any($event.target).value)" placeholder="e.g. Fidelity, E*TRADE" />
    </div>

    <div class="row">
      <label for="country">Country/Region</label>
      <input id="country" type="text" [value]="country()" (input)="country.set($any($event.target).value)" placeholder="e.g. US, CA, EU" />
    </div>

    <div class="row">
      <label for="notes">Notes</label>
      <textarea id="notes" rows="4" [value]="notes()" (input)="notes.set($any($event.target).value)" placeholder="Share any format details or links"></textarea>
    </div>

    <div class="actions">
      <button type="submit" [disabled]="!canSubmit()">Submit request</button>
      @if (submitting()) {
        <span class="spinner" aria-hidden="true">Submitting...</span>
      }
    </div>

    @if (successId()) {
      <div class="success">
        <mat-icon>check_circle</mat-icon>
        <span>Thanks! Request submitted. ID: {{ successId() }}</span>
      </div>
    }

    @if (errorMsg()) {
      <div class="error">
        <mat-icon>error</mat-icon>
        <span>{{ errorMsg() }}</span>
      </div>
    }
  </form>
</div>
