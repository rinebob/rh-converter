<div class="table-wrapper">
  <table mat-table [dataSource]="requests()" class="requests-table mat-elevation-z1">
    <!-- Requestor Column -->
    <ng-container matColumnDef="requestor">
      <th mat-header-cell *matHeaderCellDef class="requestor-col"> Requestor </th>
      <td mat-cell *matCellDef="let item" class="requestor" [title]="item.displayName || 'anon'"> {{ item.displayName || 'anon' }} </td>
    </ng-container>

    <!-- Broker Column -->
    <ng-container matColumnDef="brokerageName">
      <th mat-header-cell *matHeaderCellDef> Broker </th>
      <td mat-cell *matCellDef="let item"> {{ item.brokerageName }} </td>
    </ng-container>

    <!-- Status Column -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef> Status </th>
      <td mat-cell *matCellDef="let item"> {{ statusToLabel(item.status) }} </td>
    </ng-container>

    <!-- Region Column -->
    <ng-container matColumnDef="country">
      <th mat-header-cell *matHeaderCellDef> Region </th>
      <td mat-cell *matCellDef="let item"> {{ item.country || '—' }} </td>
    </ng-container>

    <!-- Date Created Column -->
    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef> Date Created </th>
      <td mat-cell *matCellDef="let item"> {{ item.createdAtMs ? (item.createdAtMs | date:'yyyy-MM-dd') : '—' }} </td>
    </ng-container>

    <!-- Votes Column -->
    <ng-container matColumnDef="votes">
      <th mat-header-cell *matHeaderCellDef class="votes-col"> Votes </th>
      <td mat-cell *matCellDef="let item" class="votes">
        <span class="count" title="Score (upvotes - downvotes)">{{ item.upvoteCount }}</span>
      </td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="actions-col"> Up/Down Vote </th>
      <td mat-cell *matCellDef="let item" class="actions">
        <button mat-icon-button color="primary" type="button" (click)="onUpvote(item)" aria-label="Upvote">
          <mat-icon fontIcon="arrow_upward"></mat-icon>
        </button>
        <button mat-icon-button color="warn" type="button" (click)="onDownvote(item)" aria-label="Downvote">
          <mat-icon fontIcon="arrow_downward"></mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
