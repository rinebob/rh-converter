<mat-sidenav-container class="sidenav-container">
  <!-- Sidenav -->
  <mat-sidenav #sidenav 
              [mode]="(isHandset$ | async)?.matches ? 'over' : 'side'"
              [opened]="!(isHandset$ | async)?.matches"
              class="sidenav">
    <div class="sidenav-header">
      <h2>Robinhood Converter</h2>
    </div>
    
    <mat-nav-list>
      <!-- Dashboard -->
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active" (click)="closeSidenavIfHandset()">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      
      <!-- Upload -->
      <a mat-list-item routerLink="/upload" routerLinkActive="active" (click)="closeSidenavIfHandset()">
        <mat-icon matListItemIcon>upload_file</mat-icon>
        <span matListItemTitle>Upload CSV</span>
      </a>
      
      <!-- Subscription Status -->
      <div class="subscription-status" *ngIf="subscriptionService.currentPlan() as plan">
        <mat-divider></mat-divider>
        <div class="status-header">
          <mat-icon>workspace_premium</mat-icon>
          <span>{{ plan.name }} Plan</span>
        </div>
        <mat-progress-bar
          mode="determinate"
          [value]="(subscriptionService.usage()?.currentCount || 0) / (subscriptionService.usage()?.monthlyLimit || 1) * 100"
          [color]="subscriptionService.usage()?.isWithinLimit ? 'primary' : 'warn'"
          class="usage-bar">
        </mat-progress-bar>
        <div class="usage-details">
          <span>{{ subscriptionService.usage()?.currentCount || 0 }} / {{ subscriptionService.usage()?.monthlyLimit || 0 }} records</span>
          <a *ngIf="subscriptionService.isFreeTier()" (click)="upgradePlan()">Upgrade</a>
        </div>
      </div>
    </mat-nav-list>
  </mat-sidenav>
  
  <!-- Main Content -->
  <mat-sidenav-content>
    <!-- Toolbar -->
    <mat-toolbar color="primary" class="toolbar">
      <button mat-icon-button (click)="sidenav.toggle()" class="menu-button">
        <mat-icon>menu</mat-icon>
      </button>
      
      <span class="spacer"></span>
      
      <!-- User Menu -->
      <button mat-button [matMenuTriggerFor]="userMenu" class="user-menu-button">
        <div class="user-info">
          <span class="user-name">{{ (currentUser$ | async)?.displayName || 'User' }}</span>
          <span class="user-email">{{ (currentUser$ | async)?.email || '' }}</span>
        </div>
        <mat-icon>arrow_drop_down</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu">
        <button mat-menu-item routerLink="/settings">
          <mat-icon>settings</mat-icon>
          <span>Settings</span>
        </button>
        <button mat-menu-item (click)="signOut()">
          <mat-icon>logout</mat-icon>
          <span>Sign Out</span>
        </button>
      </mat-menu>
    </mat-toolbar>
    
    <!-- Page Content -->
    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
